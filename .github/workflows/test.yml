name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-docx:
    runs-on: ubuntu-latest
    env:
      CI: "1"   # missing render tools fail the run instead of skipping
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc, LibreOffice and poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pandoc libreoffice-writer poppler-utils zip
      - name: Reference document structure and two-page render
        run: python3 tests/test_reference_docx.py
      - name: Skill zip still builds
        run: ./scripts/package.sh
