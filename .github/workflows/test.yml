name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md conforms to the Agent Skills spec
        run: python3 tests/test_skill_spec.py
      - name: Cross-file references resolve
        run: python3 tests/test_skill_consistency.py
      - name: Eval cases and transcripts are well formed
        run: python3 tests/test_evals.py

  reference-docx:
    runs-on: ubuntu-latest
    env:
      CI: "1"   # missing render tools fail the run instead of skipping
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc, LibreOffice, Carlito and poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pandoc libreoffice-writer fonts-crosextra-carlito poppler-utils zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-docx and reportlab, as phase 2's branch (b) does
        run: python3 -m pip install python-docx reportlab
      - name: Reference document structure and two-page render
        run: python3 tests/test_reference_docx.py
      - name: Skill zip still builds
        run: ./scripts/package.sh
