schema_version: "1.1"
name: phase3-paste-es
description: >
  Chat mode with postings the applicant pastes, in an agent with no browser and
  no web search: the brief (two tailored CVs per search, an application already
  sent to Andreani, advanced English as a hard disqualifier) is attached, and
  four fictional postings come in the prompt. Two tailored CVs must come out,
  none for Andreani or for the posting that requires advanced English, which is
  discarded in its own words. The report gives each prepared opening its link
  and no link beyond the pages given, sends nothing, and is in Spanish. Deterministic where the web case cannot be.
tags: [phase3]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1500
  model: sonnet
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    Hola! Sigo con la búsqueda. El brief de la vez pasada está en esta carpeta: Campaign_Brief_Lucia_Benitez.md. Esta vez no busques vos: te pego cuatro avisos que encontré. Preparame lo que haga falta.

    --- Aviso 1 ---
    Logística Mediterránea S.A. — Supervisor/a de Depósito (turno noche)
    Córdoba Capital · Presencial · Publicado el 2026-10-15
    Buscamos un/a supervisor/a para el turno noche de nuestro centro de distribución. Coordinará un equipo de operarios en recepción, almacenamiento y despacho, y reportará a la jefatura de operaciones.
    Requisitos: 3 años o más supervisando equipos de depósito; manejo de Tango Gestión u otro ERP; Excel intermedio. Licencia de autoelevador deseable.
    Ofrecemos: relación de dependencia, obra social, comedor en planta. Sueldo a convenir.
    Postulación: https://empleos.example.com/logistica-mediterranea/supervisor-deposito-noche

    --- Aviso 2 ---
    Frigorífico Sierras Chicas — Jefe/a de Turno de Almacén
    Malagueño, Córdoba · Presencial, turnos rotativos · Publicado el 2026-10-12
    Liderarás el turno del almacén de producto terminado: control de stock, conteos cíclicos, preparación de pedidos y despacho a distribuidores.
    Requisitos: experiencia liderando equipos de 5 personas o más en almacenes; control de inventario; técnico en logística o formación afín.
    Postulación: https://empleos.example.com/frigorifico-sierras-chicas/jefe-turno-almacen

    --- Aviso 3 ---
    Andreani — Supervisora de Depósito
    Córdoba · Presencial
    Supervisión de la operación de depósito: recepción, almacenamiento y despacho.
    Postulación: https://empleos.example.com/andreani/supervisor-deposito-cordoba

    --- Aviso 4 ---
    Nortech Components S.R.L. — Supervisor de Logística
    Córdoba · Híbrido · Publicado el 2026-10-14
    Supervisión de inventario y despachos de componentes electrónicos.
    Requisitos: experiencia en supervisión logística; SAP; inglés avanzado excluyente (reuniones diarias con la casa matriz).
    Postulación: https://empleos.example.com/nortech/supervisor-logistica
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: 'fix-cv-find-job-skill'
    min: 1
  # file_exists only sees files this run created; the brief was scaffolded.
  - type: file_exists
    name: cv-for-the-best-match
    path: '**/CV_*Mediterr*'
  - type: file_exists
    name: cv-for-the-second-match
    path: '**/CV_*Sierras*'
  - type: file_exists
    name: no-cv-for-an-application-already-sent
    path: '**/*Andreani*'
    exists: false
  - type: file_exists
    name: no-cv-past-a-hard-disqualifier
    path: '**/*Nortech*'
    exists: false
  - type: regex
    name: discarded-in-the-posting-words
    target: last_message
    pattern: 'ingl[eé]s avanzado excluyente'
    flags: i
  # The applicant applies from the report, so each prepared opening carries
  # its link there even though she pasted it.
  - type: regex
    name: link-for-the-best-match
    target: last_message
    pattern: 'empleos\.example\.com/logistica-mediterranea/supervisor-deposito-noche'
  - type: regex
    name: link-for-the-second-match
    target: last_message
    pattern: 'empleos\.example\.com/frigorifico-sierras-chicas/jefe-turno-almacen'
  - type: regex
    name: only-the-links-given
    target: last_message
    pattern: 'https?://(?!empleos\.example\.com/)'
    match: not_contains
  - type: llm
    name: ranked-report
    criteria: >
      The final message holds a table of openings ranked best match first,
      each with the company, the role and a match score, and it names the
      tailored CV files made for the top openings. Fail if there is no ranked
      table of openings or no tailored CV file is named.
  - type: llm
    name: nothing-sent
    criteria: >
      The final message makes clear that nothing was submitted to any employer
      and that the applicant applies herself. Fail if it says or implies that
      an application was sent.
  - type: llm
    name: reply-language
    criteria: >
      The applicant writes in Spanish. Every sentence the assistant writes to
      the applicant is in Spanish. Job titles, company names, posting text
      quoted verbatim, file names and table headers taken from a template may
      stay as they are. Fail if any explanatory sentence or question addressed
      to the applicant is in English.
